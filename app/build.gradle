plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.handscannervr'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.handscannervr"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    androidResources { noCompress 'task' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    implementation 'com.google.android.material:material:1.12.0'
}

// Downloads the MediaPipe hand model into assets before build
tasks.register('downloadModel') {
    doLast {
        def out = file("$projectDir/src/main/assets/hand_landmarker.task")
        if (!out.exists()) {
            out.parentFile.mkdirs()
            new URL("https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task")
                .withInputStream { input ->
                    out.withOutputStream { output -> output << input }
                }
        }
    }
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }
     .configureEach { dependsOn("downloadModel") }
